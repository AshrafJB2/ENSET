<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590">
  <style>
    text { font-family: Arial, sans-serif; fill: #183044; }
    .title { font-size: 24px; font-weight: bold; fill: #176b87; }
    .node { fill: #e6f3f7; stroke: #176b87; stroke-width: 2; }
    .leaf { fill: #f5fafb; stroke: #587887; stroke-width: 1.5; }
    .name { font-size: 17px; font-weight: bold; }
    .detail { font-size: 14px; }
    .line { stroke: #587887; stroke-width: 2; fill: none; }
  </style>
  <text class="title" x="500" y="38" text-anchor="middle">Arbre du document XML rapport</text>

  <rect class="node" x="400" y="65" width="200" height="55" rx="8"/>
  <text class="name" x="500" y="99" text-anchor="middle">&lt;rapport&gt;</text>

  <path class="line" d="M500 120 V155 H250 V185 M500 155 H750 V185"/>
  <rect class="node" x="120" y="185" width="260" height="75" rx="8"/>
  <text class="name" x="250" y="213" text-anchor="middle">&lt;mandat&gt; (1..n)</text>
  <text class="detail" x="250" y="239" text-anchor="middle">@num, @date, @montant, @etat</text>
  <rect class="node" x="620" y="185" width="260" height="75" rx="8"/>
  <text class="name" x="750" y="213" text-anchor="middle">&lt;mandat&gt; (1..n)</text>
  <text class="detail" x="750" y="239" text-anchor="middle">@num, @date, @montant, @etat</text>

  <path class="line" d="M250 260 V295 H130 V325 M250 295 H370 V325"/>
  <path class="line" d="M750 260 V295 H630 V325 M750 295 H870 V325"/>

  <rect class="leaf" x="35" y="325" width="190" height="105" rx="8"/>
  <text class="name" x="130" y="354" text-anchor="middle">&lt;expediteur/&gt;</text>
  <text class="detail" x="130" y="381" text-anchor="middle">@cin, @nom</text>
  <text class="detail" x="130" y="405" text-anchor="middle">@prenom, @ville</text>
  <rect class="leaf" x="275" y="325" width="190" height="105" rx="8"/>
  <text class="name" x="370" y="354" text-anchor="middle">&lt;destinataire/&gt;</text>
  <text class="detail" x="370" y="381" text-anchor="middle">@cin, @nom</text>
  <text class="detail" x="370" y="405" text-anchor="middle">@prenom, @ville</text>
  <rect class="leaf" x="535" y="325" width="190" height="105" rx="8"/>
  <text class="name" x="630" y="354" text-anchor="middle">&lt;expediteur/&gt;</text>
  <text class="detail" x="630" y="381" text-anchor="middle">@cin, @nom</text>
  <text class="detail" x="630" y="405" text-anchor="middle">@prenom, @ville</text>
  <rect class="leaf" x="775" y="325" width="190" height="105" rx="8"/>
  <text class="name" x="870" y="354" text-anchor="middle">&lt;destinataire/&gt;</text>
  <text class="detail" x="870" y="381" text-anchor="middle">@cin, @nom</text>
  <text class="detail" x="870" y="405" text-anchor="middle">@prenom, @ville</text>

  <text class="detail" x="500" y="480" text-anchor="middle">Chaque mandat contient un expéditeur suivi d'un destinataire.</text>
  <text class="detail" x="500" y="505" text-anchor="middle">Les deux éléments sont vides; leurs données sont portées par des attributs.</text>
</svg>
